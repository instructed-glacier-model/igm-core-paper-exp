# @package _global_
# Accuracy check, ONLINE: restart from the reference state at t = 300 yr, run to 500 yr.
defaults:
  - common: [crop_base, iceflow_online_warm, warm_start]
  - /user/conf/processes@processes.bench_seed: bench_seed
  - /user/conf/processes@processes.bench_timer: bench_timer
  - /user/conf/processes@processes.bench_sync_flow: bench_sync_flow
  - /user/conf/processes@processes.bench_sync_thk: bench_sync_thk
  - override /inputs: [local]
  - override /processes: [bench_seed, smb, iceflow, bench_sync_flow, time, thk, bench_sync_thk, bench_timer]
  - override /outputs: [local]
